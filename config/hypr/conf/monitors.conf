# ============================================================
#  Мониторы — автоматическая подстройка под окно VMware
# ============================================================

# `preferred` — берём предпочтительное разрешение виртуального
# GPU (vmwgfx). При растягивании окна VMware Workstation/Player
# разрешение подстроится автоматически. Масштаб — 1.
monitor = ,preferred,auto,1

# Пример для реального ноутбука / нескольких мониторов:
# monitor = eDP-1,preferred,auto,1
# monitor = HDMI-A-1,preferred,auto,1
