# ============================================================
#  Автозапуск (exec-once)
# ============================================================

# Панель и уведомления
exec-once = waybar
exec-once = dunst

# Polkit-агент (окна ввода пароля для sudo/GUI-программ)
exec-once = hyprpolkitagent

# Обои. Укажите свой путь к картинке или закомментируйте строку.
exec-once = swaybg -i ~/.config/hypr/background.jpg

# --- Общий буфер обмена с Windows 11 в VMware -----------------
# Требует пакет open-vm-tools: sudo pacman -S open-vm-tools
exec-once = vmware-user-suid-wrapper

# История буфера обмена (cliphist + wl-clipboard)
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Стартовая громкость
exec-once = wpctl set-volume @DEFAULT_AUDIO_SINK@ 60%

# Сетевой апплет в трее Waybar (раскомментируйте при желании):
# exec-once = nm-applet --indicator
