# ============================================================
#  Внешний вид и ввод — заточено под VMware / 3.8 ГБ ОЗУ
#  Blur, тени и анимации ОТКЛЮЧЕНЫ ради производительности.
# ============================================================

# ---------- Общие настройки ----------
general {
    layout = dwindle
    gaps_in = 3
    gaps_out = 5
    resize_on_border = false
    snap {
        enabled = false
    }
}

# ---------- Тайлинг dwindle ----------
dwindle {
    pseudotile = false
    preserve_split = true
    force_split = 0
    no_gaps_when_only = false
    smart_split = false
    smart_resizing = true
}

# ---------- Ввод ----------
input {
    # Раскладки: us,ru; переключение — Alt+Shift
    kb_layout = us,ru
    kb_options = grp:alt_shift_toggle

    # Быстрый повтор клавиш
    repeat_rate = 50
    repeat_delay = 250

    follow_mouse = 1
    accel_profile = flat
    float_switch_override_focus = 0

    touchpad {
        natural_scroll = true
        disable_while_typing = true
    }
}

# ---------- Украшения (строгая тёмная тема) ----------
decoration {
    rounding = 6
    border_size = 1
    col.active_border = rgba(7aa2f7ee)
    col.inactive_border = rgba(1a1b26ff)

    # Прозрачность по умолчанию: 1.0. Исключение только для
    # Alacritty — задаётся правилом в rules.conf.
    active_opacity = 1.0
    inactive_opacity = 1.0
    dim_inactive = false

    # Blur ОТКЛЮЧЁН — экономия ОЗУ в виртуалке
    blur {
        enabled = false
        size = 3
        passes = 1
        noise = 0.01
        vibrancy = 0.0
    }

    # Тени ОТКЛЮЧЕНЫ
    drop_shadow = false
    shadow_range = 4
    shadow_render_power = 3
    col.shadow = rgba(00000055)
}

# ---------- Анимации ОТКЛЮЧЕНЫ ----------
animations {
    enabled = false
    # Примеры, если захотите включить:
    # bezier = easeOutQuint, 0.23, 1, 0.32, 1
    # animation = windows, 1, 4, default, popin 80%
    # animation = workspaces, 1, 3, default, slide
}

# ---------- Курсор ----------
cursor {
    # КРИТИЧНО для VMware: без этого курсор пропадает
    no_hardware_cursors = true
    inactive_timeout = 0
}

# ---------- Прочее ----------
misc {
    # Отключаем дефолтные "аниме"-заставки Hyprland
    disable_hyprland_logo = true
    disable_splash_rendering = true

    # VFR — экономия ресурсов в виртуалке
    vfr = true
    animate_manual_resizes = false
    animate_mouse_windowdragging = false
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}
