# ============================================================
#  Переменные окружения — фиксы VMware и интеграция Wayland
# ============================================================

# --- КРИТИЧНО для VMware: программный курсор -----------------
# Без этой строки курсор в VMware Workstation/Player исчезает.
env = WLR_NO_HARDWARE_CURSORS,1

# Размер курсора
env = XCURSOR_SIZE,24

# Рабочий стол — Wayland/Hyprland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# Qt-приложения в Wayland-режиме
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1

# GTK
env = GDK_BACKEND,wayland,x11
env = CLUTTER_BACKEND,wayland

# Java-приложения (окна без лишних рамок)
env = _JAVA_AWT_WM_NONREPARENTING,1

# Firefox / Chromium / Electron (VS Code, Discord, Obsidian)
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# --- На крайний случай, если 3D-ускорение не заработает -------
# Раскомментируйте, чтобы разрешить софтверный рендер:
# env = WLR_RENDERER_ALLOW_SOFTWARE,1
