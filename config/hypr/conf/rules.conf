# ============================================================
#  Правила окон — windowrulev2 (синтаксис Hyprland 2025+)
# ============================================================

# ---------- Звук / Bluetooth / Сеть: плавающие по центру ----------
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = center, class:^(pavucontrol)$

windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = center, class:^(blueman-manager)$

windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = center, class:^(nm-connection-editor)$

# ---------- Диалоги выбора файлов ----------
# Порталы xdg-desktop-portal (Firefox, Chromium, GTK-приложения)
windowrulev2 = float, class:^(xdg-desktop-portal-gtk)$
windowrulev2 = center, class:^(xdg-desktop-portal-gtk)$
windowrulev2 = size 700 500, class:^(xdg-desktop-portal-gtk)$

# Нативные GTK-диалоги
windowrulev2 = float, class:^(org.gtk.FileChooser)$
windowrulev2 = center, class:^(org.gtk.FileChooser)$

# Резервный вариант по заголовку (Open / Save / Choose / Select)
windowrulev2 = float, title:^(Open|Save|Choose|Select)(.*)$
windowrulev2 = center, title:^(Open|Save|Choose|Select)(.*)$

# ---------- Прозрачность ----------
# По умолчанию все окна непрозрачные (1.0) — это задано в
# look.conf: decoration { active_opacity / inactive_opacity }.
# Исключение — только терминал:
windowrulev2 = opacity 0.95 0.95, class:^(Alacritty)$
