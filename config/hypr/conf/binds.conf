# ============================================================
#  Горячие клавиши — управление только с клавиатуры
#  $mainMod = SUPER (клавиша Windows)
# ============================================================

$mainMod = SUPER

# ------------------------------------------------------------
#  Запуск приложений
# ------------------------------------------------------------
bind = $mainMod, Q, exec, alacritty                        # терминал
bind = $mainMod, R, exec, rofi -show drun                  # меню приложений

# ------------------------------------------------------------
#  Управление окнами
# ------------------------------------------------------------
bind = $mainMod, C, killactive                             # закрыть окно
bind = $mainMod, F, fullscreen                             # полный экран
bind = $mainMod, V, togglefloating                         # плавающее/тайловое
bind = $mainMod, P, pseudo                                 # pseudo-dwindle
bind = $mainMod, M, exit                                   # выход из Hyprland

# Фокус по vim-клавишам
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Перемещение окон по vim-клавишам
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# Изменение размера окна
bind = $mainMod CTRL, H, resizeactive, -40 0
bind = $mainMod CTRL, L, resizeactive, 40 0
bind = $mainMod CTRL, K, resizeactive, 0 -40
bind = $mainMod CTRL, J, resizeactive, 0 40

# ------------------------------------------------------------
#  Воркспейсы 1..9
# ------------------------------------------------------------
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Переместить активное окно на воркспейс
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Специальный воркспейс (scratchpad) — клавиша ` (тильда)
bind = $mainMod, grave, togglespecialworkspace
bind = $mainMod SHIFT, grave, movetoworkspace, special

# ------------------------------------------------------------
#  Буфер обмена: cliphist + rofi
# ------------------------------------------------------------
# Показать историю буфера и вставить выбранное
bind = $mainMod SHIFT, V, exec, cliphist list | rofi -dmenu -p "Буфер обмена" | cliphist decode | wl-copy
# Полностью очистить историю
bind = $mainMod SHIFT, C, exec, cliphist wipe

# ------------------------------------------------------------
#  Скриншоты: grim + slurp
# ------------------------------------------------------------
# Область экрана -> в буфер обмена
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
# Весь экран -> в буфер обмена
bind = $mainMod, Print, exec, grim - | wl-copy
# Область экрана -> файл в ~/Pictures/Screenshots
bind = $mainMod SHIFT, S, exec, mkdir -p ~/Pictures/Screenshots && grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png

# ------------------------------------------------------------
#  Звук (wpctl + PipeWire)
# ------------------------------------------------------------
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# ------------------------------------------------------------
#  Мышь (зажать SUPER и тянуть окно)
# ------------------------------------------------------------
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
